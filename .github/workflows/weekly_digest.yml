name: Daily Research Paper - Digest

on:
  # Target is 02:30 UTC = 08:00 IST. GitHub delays scheduled runs heavily on
  # free runners and sometimes drops them outright -- observed here: one run
  # 5h44m late, the next skipped entirely. So we fire on several slots through
  # the morning and let the `guard` job below ensure only the first one that
  # actually lands does any work. Extra slots cost nothing when they no-op.
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST  <- the one we want
    - cron: '30 3 * * *'   # 09:00 IST
    - cron: '30 5 * * *'   # 11:00 IST
    - cron: '30 8 * * *'   # 14:00 IST  last-chance backstop
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  # Has today's edition already been published? A manual run always proceeds.
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          TODAY="$(date -u +%F)"
          LAST="$(python -c "import json,os;p='state/last_run.json';print(json.load(open(p)).get('last_edition','') if os.path.exists(p) else '')" 2>/dev/null || echo '')"
          echo "today=$TODAY last_edition=$LAST event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run - proceeding."
          elif [ "$LAST" = "$TODAY" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Today's edition already went out. This slot no-ops."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No edition yet today - proceeding."
          fi

  build-and-send:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: web

      - name: Run Daily Research Paper pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          # Raises the GitHub Search rate limit for the repo + gap lookups.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          PYTHONIOENCODING: utf-8
          DRY_RUN: "false"
        run: python main.py

      - name: Copy digest data to web app
        run: cp output/digest_data.json web/public/data/latest.json

      - name: Build Next.js static site
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NEXT_PUBLIC_REPO_SLUG: ${{ github.repository }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/out
          publish_branch: gh-pages

      - name: Remember which papers were featured
        # Persisted so the next edition does not re-feature the same paper.
        # Must not fail the run when nothing changed.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_papers.json state/last_run.json
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: record featured papers [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
