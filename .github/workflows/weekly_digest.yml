name: ML Research Pulse - Digest

on:
  # Runs daily. Whether an EMAIL goes out is decided by digest_config.json
  # (cadence: daily | weekly | paused), which the button on the digest page
  # updates via the set-cadence workflow. The page itself rebuilds every day.
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: web

      - name: Run ML Research Pulse pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          # Raises the GitHub Search rate limit for the repo + gap lookups.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          PYTHONIOENCODING: utf-8
          DRY_RUN: "false"
        run: python main.py

      - name: Copy digest data to web app
        run: cp output/digest_data.json web/public/data/latest.json

      - name: Build Next.js static site
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NEXT_PUBLIC_REPO_SLUG: ${{ github.repository }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/out
          publish_branch: gh-pages

      - name: Remember which papers were featured
        # Persisted so the next edition does not re-feature the same paper.
        # Must not fail the run when nothing changed.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_papers.json
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: record featured papers [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
